[project]
name = "qqhistory-export"
version = "1.0.0"
description = "QQ 聊天记录导出：Web 后端 + WebUI"
requires-python = ">=3.11"
dependencies = [
    "commentjson>=0.9.0",
    "configparser>=7.3.0",
    "datetime>=6.0",
    "emoji>=2.16.0",
    "fastapi>=0.163.1",
    "google==3.0.0",
    "imageio-ffmpeg>=0.8.1",
    "javaobj-py3>=0.6.1",
    "pilk>=0.2.4 ; sys_platform != 'win32'",
    "pillow>=13.0.0",
    "protobuf==3.19.4",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
qqhe = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]
